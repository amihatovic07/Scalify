<!doctype html>
<html>
  <head>
    <title>Scalify</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='main.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Scalify</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="/objects"
                >Objects</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/modeling">Modeling</a>
            </li>
            {% if session.get('is_admin') %}
            <li class="nav-item">
              <a class="nav-link" href="/">Posts</a>
            </li>
            {% endif %}
          </ul>
        </div>
        <div class="navbar-right-icons">
          <button
            class="theme-toggle"
            id="themeToggle"
            type="button"
            aria-label="Toggle dark mode"
          >
            🌙
          </button>
          {% if session.get('is_admin') %}
          <span class="badge bg-danger me-2">ADMIN</span>
          <button class="btn btn-sm btn-outline-danger" id="logoutBtn">
            Logout
          </button>
          {% else %}
          <span
            class="secret-icon"
            data-bs-toggle="modal"
            data-bs-target="#adminModal"
            >✦</span
          >
          {% endif %}
        </div>
      </div>
    </nav>
    {% block content %} {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- ADMIN LOGIN MODAL -->
    <div class="modal fade" id="adminModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="adminLoginForm">
            <div class="modal-header">
              <h5 class="modal-title">Admin Login</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <input
                type="password"
                id="adminPassword"
                class="form-control"
                placeholder="Lozinka"
                required
              />
              <div
                id="adminLoginError"
                class="text-danger mt-2"
                style="display: none"
              >
                Pogrešna lozinka.
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">Login</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("adminLoginForm");
        if (!form) return (document.getElementById("adminLoginForm") = "");

        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          try {
            const res = await fetch("/api/admin/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                password: document.getElementById("adminPassword").value,
              }),
            });

            if (res.status === 401) {
              document.getElementById("adminLoginError").textContent =
                "Pogrešna lozinka.";
              document.getElementById("adminLoginError").style.display =
                "block";
              document.getElementById("adminPassword").value = "";
              return;
            }

            if (!res.ok) {
              console.error("Server error, status:", res.status);
              document.getElementById("adminLoginError").textContent =
                "Greška na serveru (" + res.status + ").";
              document.getElementById("adminLoginError").style.display =
                "block";
              document.getElementById("adminPassword").value = "";
              return;
            }

            const data = await res.json();
            if (data.status === "ok") {
              window.location.reload();
            } else {
              document.getElementById("adminLoginError").style.display =
                "block";
            }
          } catch (err) {
            console.error("Login greška:", err);
          }
        });
      });
      const logoutBtn = document.getElementById("logoutBtn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", async function () {
          await fetch("/api/admin/logout", { method: "POST" });
          window.location.reload();
        });
      }

      document
        .getElementById("themeToggle")
        .addEventListener("click", function () {
          document.body.classList.toggle("dark-mode");
          localStorage.setItem(
            "darkMode",
            document.body.classList.contains("dark-mode"),
          );
        });

      // pri učitavanju stranice, primijeni spremljenu preferencu
      if (localStorage.getItem("darkMode") === "true") {
        document.body.classList.add("dark-mode");
      }
    </script>
  </body>
</html>
