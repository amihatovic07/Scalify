{% extends "main.html" %}

{% block content %}
    <h1 class="naslov">Objects</h1>
    <div class="objects">
        <div class="buttons">
            <button data-bs-toggle="modal" data-bs-target="#addModal">ADD Object</button>
        </div>
        <table class="table">
            <thead>
                <tr><th>Name</th><th>Type</th><th>Dimenzija</th><th>Točke</th><th></th></tr>
            </thead>
            <tbody id="oLista"></tbody>
        </table>
    </div>

    <!-- ADD MODAL -->
    <div class="modal fade" id="addModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="addForm">
            <div class="modal-header">
              <h5 class="modal-title">Add Object</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <input type="text" name="name" id="addName" class="form-control mb-2" placeholder="Name" required>
              <input type="text" name="object_type" id="addType" class="form-control mb-2" placeholder="Type" required>

              <div class="row mb-2">
                <div class="col">
                  <label class="form-label">Broj točaka</label>
                  <input type="number" id="addNumPoints" class="form-control" min="1" value="1" required>
                </div>
                <div class="col">
                  <label class="form-label">Dimenzija</label>
                  <select id="addDimension" class="form-control">
                    <option value="2">2D (X, Y)</option>
                    <option value="3" selected>3D (X, Y, Z)</option>
                  </select>
                </div>
              </div>

              <div id="pointsContainer"></div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Add</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- EDIT MODAL -->
    <div class="modal fade" id="editModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="editForm">
            <div class="modal-header">
              <h5 class="modal-title">Edit Object</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="editId">
              <input type="text" name="name" id="editName" class="form-control mb-2" required>
              <input type="text" name="object_type" id="editType" class="form-control mb-2" required>

              <div class="row mb-2">
                <div class="col">
                  <label class="form-label">Broj točaka</label>
                  <input type="number" id="editNumPoints" class="form-control" min="1" value="1" required>
                </div>
                <div class="col">
                  <label class="form-label">Dimenzija</label>
                  <select id="editDimension" class="form-control">
                    <option value="2">2D (X, Y)</option>
                    <option value="3">3D (X, Y, Z)</option>
                  </select>
                </div>
              </div>

              <div id="editPointsContainer"></div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Save</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- DELETE MODAL -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Delete Object</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            Jesi siguran da želiš obrisati <strong id="deleteName"></strong>?
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
          </div>
        </div>
      </div>
    </div>

    <script>
    // ============ UČITAVANJE LISTE OBJEKATA ============
    async function loadObjects() {
        const res = await fetch('/api/objects');
        const data = await res.json();
        const tbody = document.getElementById('oLista');
        tbody.innerHTML = '';

        data.objects.forEach(obj => {
            const pointsStr = obj.points.map(p =>
                obj.dimension === 3 ? `(${p.x}, ${p.y}, ${p.z})` : `(${p.x}, ${p.y})`
            ).join(', ');

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${obj.name}</td>
                <td>${obj.object_type}</td>
                <td>${obj.dimension}D</td>
                <td>${obj.points.length} točaka: ${pointsStr}</td>
                <td>
                    <button class="btn btn-sm btn-secondary"
                        data-bs-toggle="modal" data-bs-target="#editModal"
                        data-id="${obj.id}">
                        Edit
                    </button>
                    <button class="btn btn-sm btn-danger"
                        data-bs-toggle="modal" data-bs-target="#deleteModal"
                        data-id="${obj.id}" data-name="${obj.name}">
                        Delete
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    loadObjects(); // pozovi odmah pri učitavanju stranice

    // ============ ADD ============
    function renderPointInputs() {
        const num = parseInt(document.getElementById('addNumPoints').value) || 0;
        const dim = parseInt(document.getElementById('addDimension').value);
        const container = document.getElementById('pointsContainer');
        container.innerHTML = '';

        for (let i = 0; i < num; i++) {
            const div = document.createElement('div');
            div.className = 'row mb-2 point-row';
            div.innerHTML = `
                <div class="col-auto align-self-center">Točka ${i + 1}</div>
                <div class="col"><input type="number" step="any" class="form-control point-x" placeholder="X" required></div>
                <div class="col"><input type="number" step="any" class="form-control point-y" placeholder="Y" required></div>
                ${dim === 3 ? `<div class="col"><input type="number" step="any" class="form-control point-z" placeholder="Z" required></div>` : ''}
            `;
            container.appendChild(div);
        }
    }

    document.getElementById('addNumPoints').addEventListener('input', renderPointInputs);
    document.getElementById('addDimension').addEventListener('change', renderPointInputs);
    document.getElementById('addModal').addEventListener('show.bs.modal', renderPointInputs);

    document.getElementById('addForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const dim = parseInt(document.getElementById('addDimension').value);
        const pointRows = document.querySelectorAll('.point-row');
        const points = Array.from(pointRows).map(row => {
            const point = {
                x: parseFloat(row.querySelector('.point-x').value) || 0,
                y: parseFloat(row.querySelector('.point-y').value) || 0
            };
            if (dim === 3) {
                point.z = parseFloat(row.querySelector('.point-z').value) || 0;
            }
            return point;
        });

        const res = await fetch('/objects/add', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: document.getElementById('addName').value,
                object_type: document.getElementById('addType').value,
                dimension: dim,
                points: points
            })
        });

        if (res.ok) {
            bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
            document.getElementById('addForm').reset();
            document.getElementById('pointsContainer').innerHTML = '';
            loadObjects();
        } else {
            alert('Greška kod dodavanja.');
        }
    });

    // ============ EDIT ============
    function renderEditPointInputs(existingPoints = []) {
        const num = parseInt(document.getElementById('editNumPoints').value) || 0;
        const dim = parseInt(document.getElementById('editDimension').value);
        const container = document.getElementById('editPointsContainer');
        container.innerHTML = '';

        for (let i = 0; i < num; i++) {
            const p = existingPoints[i] || {};
            const div = document.createElement('div');
            div.className = 'row mb-2 edit-point-row';
            div.innerHTML = `
                <div class="col-auto align-self-center">Točka ${i + 1}</div>
                <div class="col"><input type="number" step="any" class="form-control edit-point-x" placeholder="X" value="${p.x ?? ''}" required></div>
                <div class="col"><input type="number" step="any" class="form-control edit-point-y" placeholder="Y" value="${p.y ?? ''}" required></div>
                ${dim === 3 ? `<div class="col"><input type="number" step="any" class="form-control edit-point-z" placeholder="Z" value="${p.z ?? ''}" required></div>` : ''}
            `;
            container.appendChild(div);
        }
    }

    document.getElementById('editNumPoints').addEventListener('input', () => renderEditPointInputs());
    document.getElementById('editDimension').addEventListener('change', () => renderEditPointInputs());

    // dohvati postojeći objekt s backenda kad se modal otvori i popuni formu
    document.getElementById('editModal').addEventListener('show.bs.modal', async function (event) {
        const btn = event.relatedTarget;
        const id = btn.getAttribute('data-id');

        const res = await fetch('/objects/edit/' + id);
        const obj = await res.json();

        document.getElementById('editId').value = obj.id;
        document.getElementById('editName').value = obj.name;
        document.getElementById('editType').value = obj.object_type;
        document.getElementById('editDimension').value = obj.dimension;
        document.getElementById('editNumPoints').value = obj.points.length;

        renderEditPointInputs(obj.points);
    });

    document.getElementById('editForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const id = document.getElementById('editId').value;
        const dim = parseInt(document.getElementById('editDimension').value);
        const pointRows = document.querySelectorAll('.edit-point-row');
        const points = Array.from(pointRows).map(row => {
            const point = {
                x: parseFloat(row.querySelector('.edit-point-x').value) || 0,
                y: parseFloat(row.querySelector('.edit-point-y').value) || 0
            };
            if (dim === 3) {
                point.z = parseFloat(row.querySelector('.edit-point-z').value) || 0;
            }
            return point;
        });

        const res = await fetch('/objects/edit/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: document.getElementById('editName').value,
                object_type: document.getElementById('editType').value,
                dimension: dim,
                points: points
            })
        });

        if (res.ok) {
            bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
            loadObjects();
        } else {
            alert('Greška kod spremanja.');
        }
    });

    // ============ DELETE ============
    let deleteId = null;
    document.getElementById('deleteModal').addEventListener('show.bs.modal', function (event) {
        const btn = event.relatedTarget;
        deleteId = btn.getAttribute('data-id');
        document.getElementById('deleteName').textContent = btn.getAttribute('data-name');
    });

    document.getElementById('confirmDeleteBtn').addEventListener('click', async function () {
        const res = await fetch('/objects/delete/' + deleteId, { method: 'DELETE' });
        if (res.ok) {
            bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
            loadObjects();
        } else {
            alert('Greška kod brisanja.');
        }
    });
    </script>
{% endblock %}
