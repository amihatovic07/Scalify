{% extends "main.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="naslov">Scalify</h1>

    {% if session.get('is_admin') %}
    <div class="mb-3">
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPostModal">
            Add post
        </button>
    </div>
    {% endif %}

    <div id="pLista" class="row g-3"></div>
</div>

<!-- ADD POST MODAL -->
<div class="modal fade" id="addPostModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="addPostForm">
        <div class="modal-header">
          <h5 class="modal-title">Add Post</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="text" id="addPostTitle" class="form-control mb-2" placeholder="Naslov" required>
          <textarea id="addPostContent" class="form-control" rows="5" placeholder="Sadržaj" required></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- EDIT POST MODAL -->
<div class="modal fade" id="editPostModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="editPostForm">
        <div class="modal-header">
          <h5 class="modal-title">Edit Post</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editPostId">
          <input type="text" id="editPostTitle" class="form-control mb-2" required>
          <textarea id="editPostContent" class="form-control" rows="5" required></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- DELETE POST MODAL -->
<div class="modal fade" id="deletePostModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Delete Post</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Jesi siguran da želiš obrisati <strong id="deletePostTitle"></strong>?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDeletePostBtn">Delete</button>
      </div>
    </div>
  </div>
</div>

<script>
// Jinja upiše true/false direktno u JS na temelju iste sesije koja odlučuje o "Add post" gumbu -
// tako JS zna treba li iscrtati Edit/Delete gumbe unutar svake kartice objave.
const isAdmin = {{ 'true' if session.get('is_admin') else 'false' }};

// ============ UČITAVANJE OBJAVA ============
async function loadPosts() {
    const res = await fetch('/api/posts');
    const data = await res.json();
    const lista = document.getElementById('pLista');
    lista.innerHTML = '';

    data.posts.forEach(post => {
        const col = document.createElement('div');
        col.className = 'col-md-6';

        const adminButtons = isAdmin ? `
            <button class="btn btn-sm btn-secondary edit-post-btn" data-id="${post.id}">Edit</button>
            <button class="btn btn-sm btn-danger delete-post-btn" data-id="${post.id}" data-title="${post.title}">Delete</button>
        ` : '';

        col.innerHTML = `
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">${post.title}</h5>
                    <p class="card-text">${post.content}</p>
                    <small class="text-muted">${post.created_at}</small>
                    <div class="mt-2">${adminButtons}</div>
                </div>
            </div>
        `;
        lista.appendChild(col);
    });

    // gumbi se dodaju u DOM tek nakon renderiranja, pa se listeneri vežu ovdje (samo ako je admin)
    if (isAdmin) {
        document.querySelectorAll('.edit-post-btn').forEach(btn => {
            btn.addEventListener('click', () => openEditPost(btn.getAttribute('data-id')));
        });
        document.querySelectorAll('.delete-post-btn').forEach(btn => {
            btn.addEventListener('click', () => openDeletePost(btn.getAttribute('data-id'), btn.getAttribute('data-title')));
        });
    }
}

loadPosts();

// ============ ADD (samo postoji u DOM-u ako je admin, pa se safe-guarda ovako) ============
const addPostForm = document.getElementById('addPostForm');
if (addPostForm) {
    addPostForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        const res = await fetch('/api/posts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                title: document.getElementById('addPostTitle').value,
                content: document.getElementById('addPostContent').value
            })
        });
        if (res.ok) {
            bootstrap.Modal.getInstance(document.getElementById('addPostModal')).hide();
            addPostForm.reset();
            loadPosts();
        } else {
            alert('Greška kod dodavanja objave.');
        }
    });
}

// ============ EDIT ============
function openEditPost(id) {
    fetch('/api/posts').then(r => r.json()).then(data => {
        const post = data.posts.find(p => p.id == id);
        document.getElementById('editPostId').value = post.id;
        document.getElementById('editPostTitle').value = post.title;
        document.getElementById('editPostContent').value = post.content;
        new bootstrap.Modal(document.getElementById('editPostModal')).show();
    });
}

const editPostForm = document.getElementById('editPostForm');
if (editPostForm) {
    editPostForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        const id = document.getElementById('editPostId').value;
        const res = await fetch('/api/posts/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                title: document.getElementById('editPostTitle').value,
                content: document.getElementById('editPostContent').value
            })
        });
        if (res.ok) {
            bootstrap.Modal.getInstance(document.getElementById('editPostModal')).hide();
            loadPosts();
        } else {
            alert('Greška kod spremanja objave.');
        }
    });
}

// ============ DELETE ============
let deletePostId = null;
function openDeletePost(id, title) {
    deletePostId = id;
    document.getElementById('deletePostTitle').textContent = title;
    new bootstrap.Modal(document.getElementById('deletePostModal')).show();
}

const confirmDeletePostBtn = document.getElementById('confirmDeletePostBtn');
if (confirmDeletePostBtn) {
    confirmDeletePostBtn.addEventListener('click', async function () {
        const res = await fetch('/api/posts/' + deletePostId, { method: 'DELETE' });
        if (res.ok) {
            bootstrap.Modal.getInstance(document.getElementById('deletePostModal')).hide();
            loadPosts();
        } else {
            alert('Greška kod brisanja objave.');
        }
    });
}
</script>
{% endblock %}
